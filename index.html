<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>3D Neon Kaleidoscope Tunnel Pad</title>
<!-- Fixed: Correct Three.js Library link via CDN -->
<script src="https://cloudflare.com"></script>
<style>
body{margin:0;padding:0;background:#000;color:#fff;font-family:sans-serif;overflow:hidden;height:100vh;user-select:none;-webkit-user-select:none;}
hdr{text-align:center;padding:8px 0;background:rgba(10,10,10,0.95);border-bottom:1px solid #111;position:absolute;top:0;left:0;right:0;height:30px;z-index:15;}
.w-txt{color:#FFD700;font-size:18px;font-weight:bold;text-shadow:0 0 10px #FFD700;margin:0;}
.toolbar{background:rgba(15,15,15,0.98);border-bottom:1px solid #222;padding:10px;box-sizing:border-box;position:absolute;top:46px;left:0;right:0;height:90px;z-index:15;display:flex;flex-direction:column;gap:8px;}
.row{display:flex;justify-content:space-around;align-items:center;gap:10px;}
.control-group{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:bold;color:#ccc;}
input[type="range"]{width:80px;accent-color:#FFD700;}
.btn{background:#222;color:#fff;border:1px solid #444;padding:6px 12px;font-weight:bold;font-size:13px;border-radius:6px;cursor:pointer;}
.clear-btn{background:#500;border-color:#800;}
.spin-btn{background:#2b6cb0;border-color:#3182ce;}
.palette{display:flex;gap:10px;overflow-x:auto;padding:2px;justify-content:center;width:100%;}
.dot{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;box-sizing:border-box;transition:transform 0.1s;}
.dot.active{border-color:#fff;transform:scale(1.25);}
#canvas-container{position:absolute;top:136px;bottom:0;left:0;right:0;background:#000;z-index:5;}
canvas{display:block;width:100%;height:100%;touch-action:none;}
</style>
</head>
<body>
<hdr><div class="w-txt">3D Neon Kaleidoscope Tunnel Pad</div></hdr>
<div class="toolbar">
    <div class="row">
        <div class="control-group"><label>Slices:</label><input type="range" id="slices" min="4" max="36" value="12" step="2"></div>
        <div class="control-group"><label>Size:</label><input type="range" id="size" min="2" max="25" value="6"></div>
        <div class="control-group"><label>⚡ Speed:</label><input type="range" id="speed" min="1" max="10" value="3" onchange="document.getElementById('spdVal').innerText=this.value"><span id="spdVal" style="color:#FFD700;width:16px;">3</span></div>
        <button class="btn spin-btn" id="spinToggle" onclick="toggleSpin()">🔄 Spin: OFF</button>
        <button class="btn clear-btn" onclick="clearCanvas()">🗑️ Clear</button>
    </div>
    <div class="row"><div class="palette" id="palette"></div></div>
</div>
<div id="canvas-container"><canvas id="paintCanvas"></canvas></div>
<script>
const canvas=document.getElementById('paintCanvas'),container=document.getElementById('canvas-container');
const memCan=document.createElement('canvas'),memCtx=memCan.getContext('2d');
let isDrawing=false,lastX=0,lastY=0,curColor='#00FFFF',isSpinning=false,spinAngle=0;
const neonColors=['#00FFFF','#FF00FF','#00FF00','#FFD700','#FF3333','#33FFF6','#9D33FF','#FF55BB','#FFFFFF'];

let scene, camera, renderer, tunnelMesh, canvasTexture;

function init3DEngine() {
    scene = new THREE.Scene();
    
    camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(0, 0, 0.1); 

    renderer = new THREE.WebGLRenderer({canvas: canvas, antialias: true, alpha: false});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 

    const tubeGeo = new THREE.CylinderGeometry(2.5, 2.5, 12, 32, 1, true);
    
    canvasTexture = new THREE.CanvasTexture(memCan);
    canvasTexture.wrapS = THREE.RepeatWrapping;
    canvasTexture.wrapT = THREE.RepeatWrapping;
    canvasTexture.repeat.set(2, 2); 

    const tubeMat = new THREE.MeshBasicMaterial({
        map: canvasTexture, 
        side: THREE.BackSide, 
        transparent: false
    });
    
    tunnelMesh = new THREE.Mesh(tubeGeo, tubeMat);
    tunnelMesh.rotation.x = Math.PI / 2; 
    tunnelMesh.position.set(0, 0, -4); 
    scene.add(tunnelMesh);

    resizeCanvas();
    setupPalette();
    setupEventListeners(); // Fixed: Binding input events to interact with canvas
    renderLoop();
}

function resizeCanvas(){
    if (!container || !renderer) return;
    const w=container.clientWidth,h=container.clientHeight;
    renderer.setSize(w, h); 
    camera.aspect = w / h; 
    camera.updateProjectionMatrix();
    
    memCan.width=512; memCan.height=512; 
    clearCanvas();
}

function setupPalette(){
    const p=document.getElementById('palette');
    if (!p || p.children.length > 0) return;
    neonColors.forEach((c,i)=>{
        const d=document.createElement('div');d.className='dot';d.style.backgroundColor=c;d.style.boxShadow=`0 0 12px ${c}`;
        if(i===0)d.classList.add('active');
        d.addEventListener('click',()=>{document.querySelectorAll('.dot').forEach(el=>el.classList.remove('active'));d.classList.add('active');curColor=c;});
        p.appendChild(d);
    });
}

function clearCanvas(){
    if (!memCtx || !canvasTexture) return;
    memCtx.fillStyle='#000'; memCtx.fillRect(0,0,memCan.width,memCan.height);
    canvasTexture.needsUpdate = true;
}

function drawSymmetry(x1,y1,x2,y2){
    if (!memCtx || !canvasTexture) return;
    const cx=memCan.width/2,cy=memCan.height/2,slices=parseInt(document.getElementById('slices').value),bSize=parseInt(document.getElementById('size').value),step=(Math.PI*2)/slices;
    const sx=x1-cx,sy=y1-cy,ex=x2-cx,ey=y2-cy;
    memCtx.save();memCtx.translate(cx,cy);memCtx.lineWidth=bSize;memCtx.strokeStyle=curColor;memCtx.shadowBlur=bSize*2.2;memCtx.shadowColor=curColor;
    memCtx.lineCap='round';memCtx.lineJoin='round';
    for(let i=0;i<slices;i++){
        memCtx.rotate(step);
        memCtx.beginPath();memCtx.moveTo(sx,sy);memCtx.lineTo(ex,ey);memCtx.stroke();
        memCtx.beginPath();memCtx.moveTo(sx,-sy);memCtx.lineTo(ex,-ey);memCtx.stroke();
    }
    memCtx.restore();
    canvasTexture.needsUpdate = true; 
}

function toggleSpin(){isSpinning=!isSpinning;document.getElementById('spinToggle').innerText=isSpinning?"🔄 Spin: ON":"🔄 Spin: OFF";}

function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    let clientX = 0, clientY = 0;
    if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX; 
        clientY = e.touches[0].clientY;
    } else {
        clientX = e.clientX; 
        clientY = e.clientY;
    }
    const normX = (clientX - rect.left) / rect.width;
    const normY = (clientY - rect.top) / rect.height;
    return { x: normX * memCan.width, y: normY * memCan.height };
}

function start(e){isDrawing=true;const p=getPos(e);lastX=p.x;lastY=p.y;}
function move(e){if(!isDrawing)return;e.preventDefault();const p=getPos(e);drawSymmetry(lastX,lastY,p.x,p.y);lastX=p.x;lastY=p.y;}
function stop(){isDrawing=false;}

// Fixed: Link the functions explicitly to handle user interface movement input
function setupEventListeners() {
    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    window.addEventListener('mouseup', stop);

    canvas.addEventListener('touchstart', start, {passive: false});
    canvas.addEventListener('touchmove', move, {passive: false});
    window.addEventListener('touchend', stop);
    
    window.addEventListener('resize', resizeCanvas);
}

function renderLoop(){
    requestAnimationFrame(renderLoop);
    if (!renderer || !scene || !camera) return;
    if(isSpinning && tunnelMesh){
        const speedMultiplier=parseInt(document.getElementById('speed').value);
        tunnelMesh.rotation.y += (speedMultiplier * 0.005);
    }
    renderer.render(scene, camera); // Fixed: Added missing execution render block inside the animation loop
}

// Start everything up on window load
window.onload = init3DEngine;
</script>
</body>
</html>
